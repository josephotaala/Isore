{% extends 'Home/base.html' %}{% block title %}Log in | Osore Clan{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-panel"><p class="eyebrow">WELCOME BACK</p><h1>Come on in.</h1><p class="muted">Your clan is waiting for you.</p><form method="post">{% csrf_token %}<label for="username">Username</label><input id="username" name="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" required><button class="button full" type="submit">Log in</button></form><p class="form-foot">New to Osore? <a href="{% url 'register' %}">Create an account</a></p></div></section>{% endblock %}
